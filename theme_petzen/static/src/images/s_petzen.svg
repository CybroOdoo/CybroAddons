<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- card background -->
  <rect x="0" y="0" width="300" height="200" rx="6" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="299" height="199" rx="6" fill="none" stroke="#d9dde1"/>

  <!-- top nav bar -->
  <rect x="0" y="0" width="300" height="22" rx="6" fill="#f1f3f5"/>
  <rect x="0" y="12" width="300" height="10" fill="#f1f3f5"/>
  <circle cx="14" cy="11" r="4" fill="#ff8a3d"/>
  <rect x="24" y="8" width="30" height="6" rx="3" fill="#c9ced4"/>
  <rect x="190" y="8" width="20" height="6" rx="3" fill="#dfe3e7"/>
  <rect x="216" y="8" width="20" height="6" rx="3" fill="#dfe3e7"/>
  <rect x="242" y="8" width="20" height="6" rx="3" fill="#dfe3e7"/>
  <rect x="268" y="7" width="22" height="8" rx="4" fill="#1fa39a"/>

  <!-- hero background -->
  <rect x="12" y="32" width="276" height="156" rx="6" fill="#e8f6f5"/>

  <!-- paw print (hero) -->
  <g fill="#1fa39a" transform="translate(200 108)">
    <ellipse cx="0" cy="22" rx="26" ry="21"/>
    <ellipse cx="-30" cy="-6" rx="9" ry="12" transform="rotate(-25 -30 -6)"/>
    <ellipse cx="-11" cy="-24" rx="9" ry="13" transform="rotate(-8 -11 -24)"/>
    <ellipse cx="11" cy="-24" rx="9" ry="13" transform="rotate(8 11 -24)"/>
    <ellipse cx="30" cy="-6" rx="9" ry="12" transform="rotate(25 30 -6)"/>
  </g>

  <!-- small accent paw -->
  <g fill="#ff8a3d" opacity="0.9" transform="translate(262 52) scale(0.32)">
    <ellipse cx="0" cy="22" rx="26" ry="21"/>
    <ellipse cx="-30" cy="-6" rx="9" ry="12" transform="rotate(-25 -30 -6)"/>
    <ellipse cx="-11" cy="-24" rx="9" ry="13" transform="rotate(-8 -11 -24)"/>
    <ellipse cx="11" cy="-24" rx="9" ry="13" transform="rotate(8 11 -24)"/>
    <ellipse cx="30" cy="-6" rx="9" ry="12" transform="rotate(25 30 -6)"/>
  </g>

  <!-- heading / text placeholders -->
  <rect x="28" y="62" width="90" height="12" rx="3" fill="#13605b"/>
  <rect x="28" y="80" width="60" height="12" rx="3" fill="#13605b"/>
  <rect x="28" y="102" width="96" height="5" rx="2.5" fill="#9bc9c5"/>
  <rect x="28" y="112" width="80" height="5" rx="2.5" fill="#9bc9c5"/>
  <rect x="28" y="122" width="88" height="5" rx="2.5" fill="#9bc9c5"/>

  <!-- CTA button -->
  <rect x="28" y="142" width="54" height="16" rx="8" fill="#ff8a3d"/>
  <rect x="38" y="148" width="34" height="4" rx="2" fill="#ffffff"/>

  <!-- brand label -->
  <text x="150" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#13605b" opacity="0.0">PETZEN</text>
</svg>
