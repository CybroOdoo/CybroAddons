<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff0033" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="20" y="20" width="260" height="160" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Target Frame Corners -->
  <path d="M 45 55 L 45 40 L 60 40" stroke="#71639e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 255 55 L 255 40 L 240 40" stroke="#71639e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 45 145 L 45 160 L 60 160" stroke="#71639e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 255 145 L 255 160 L 240 160" stroke="#71639e" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Barcode Bars -->
  <g fill="#1e293b">
    <rect x="75" y="60" width="4" height="80" rx="1"/>
    <rect x="83" y="60" width="8" height="80" rx="1"/>
    <rect x="95" y="60" width="3" height="80" rx="1"/>
    <rect x="102" y="60" width="6" height="80" rx="1"/>
    <rect x="112" y="60" width="12" height="80" rx="1"/>
    <rect x="128" y="60" width="4" height="80" rx="1"/>
    <rect x="136" y="60" width="8" height="80" rx="1"/>
    <rect x="148" y="60" width="3" height="80" rx="1"/>
    <rect x="155" y="60" width="10" height="80" rx="1"/>
    <rect x="169" y="60" width="5" height="80" rx="1"/>
    <rect x="178" y="60" width="14" height="80" rx="1"/>
    <rect x="196" y="60" width="4" height="80" rx="1"/>
    <rect x="204" y="60" width="8" height="80" rx="1"/>
    <rect x="216" y="60" width="3" height="80" rx="1"/>
    <rect x="223" y="60" width="6" height="80" rx="1"/>
  </g>

  <!-- Glowing Laser Scan Line -->
  <line x1="50" y1="100" x2="250" y2="100" stroke="url(#laserGrad)" stroke-width="3" filter="url(#laserGlow)"/>
</svg>
