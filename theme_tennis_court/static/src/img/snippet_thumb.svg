<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="12" fill="#0b64d6"/>
  <!-- Tennis court lines -->
  <rect x="30" y="55" width="140" height="90" rx="3" fill="none" stroke="white" stroke-width="3"/>
  <!-- Center service line (vertical) -->
  <line x1="100" y1="55" x2="100" y2="145" stroke="white" stroke-width="2"/>
  <!-- Service boxes line (horizontal) -->
  <line x1="30" y1="100" x2="170" y2="100" stroke="white" stroke-width="2"/>
  <!-- Net -->
  <line x1="30" y1="100" x2="170" y2="100" stroke="white" stroke-width="4"/>
  <line x1="28" y1="94" x2="28" y2="106" stroke="white" stroke-width="3"/>
  <line x1="172" y1="94" x2="172" y2="106" stroke="white" stroke-width="3"/>
  <!-- Tennis ball -->
  <circle cx="140" cy="75" r="12" fill="#f5e642"/>
  <path d="M130 72 Q140 65 150 72" fill="none" stroke="white" stroke-width="1.5"/>
  <path d="M130 78 Q140 85 150 78" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Label -->
  <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.9">Tennis Court</text>
</svg>
