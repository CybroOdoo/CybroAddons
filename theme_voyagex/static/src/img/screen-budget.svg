    <rect x="24" y="92" width="332" height="36" rx="12" fill="#f0fdfa"/>
    <text x="40" y="116" font-family="SF Pro Display,-apple-system,sans-serif" font-size="12" fill="#64748b">📍 Amalfi Coast · Mar 28 - Apr 3 · 4 travelers</text>

    <!-- Total spent card -->
    <rect x="24" y="144" width="332" height="160" rx="22" fill="url(#bg1)" filter="url(#bgs)"/>
    <circle cx="320" cy="190" r="50" fill="white" opacity="0.06"/>
    <circle cx="340" cy="280" r="30" fill="white" opacity="0.04"/>
    <text x="44" y="176" font-family="SF Pro Display,-apple-system,sans-serif" font-size="12" fill="white" opacity="0.8">TOTAL SPENT</text>
    <text x="44" y="218" font-family="SF Pro Display,-apple-system,sans-serif" font-size="36" font-weight="700" fill="white">$1,240</text>
    <text x="192" y="218" font-family="SF Pro Display,-apple-system,sans-serif" font-size="14" fill="white" opacity="0.7">.00</text>
    <text x="44" y="244" font-family="SF Pro Display,-apple-system,sans-serif" font-size="12" fill="white" opacity="0.7">Budget: $2,000.00</text>
