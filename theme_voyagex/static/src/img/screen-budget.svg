    <circle cx="190" cy="726" r="22" fill="url(#bg1)"/>
    <line x1="182" y1="726" x2="198" y2="726" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="190" y1="718" x2="190" y2="734" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="250" y="726" width="14" height="14" rx="3" fill="none" stroke="#0ea5a5" stroke-width="1.8"/>
    <text x="244" y="752" font-family="SF Pro Display,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#0ea5a5">Trips</text>
    <circle cx="330" cy="730" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="316" y="752" font-family="SF Pro Display,-apple-system,sans-serif" font-size="10" fill="#94a3b8">Profile</text>
  </g>
</svg>