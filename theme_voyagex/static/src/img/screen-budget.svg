<svg xmlns="http://www.w3.org/2000/svg" width="380" height="780" viewBox="0 0 380 780">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5a5"/><stop offset="100%" stop-color="#e8458b"/></linearGradient>
    <linearGradient id="bgteal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5a5"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="bgpink" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#e8458b"/></linearGradient>
    <linearGradient id="bgorange" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="bgpurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <clipPath id="bgClip"><rect width="380" height="780" rx="40"/></clipPath>
    <filter id="bgs" x="-5%" y="-5%" width="115%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="380" height="780" rx="40" fill="#f8fffe"/>
