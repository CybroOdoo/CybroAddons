    <text x="290" y="378" font-family="SF Pro Display,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">$450.00</text>

    <rect x="24" y="416" width="332" height="60" rx="16" fill="white" filter="url(#bgs)"/>
    <rect x="38" y="428" width="36" height="36" rx="10" fill="url(#bgpink)"/>
    <text x="46" y="452" font-family="sans-serif" font-size="16">🏨</text>
    <text x="86" y="442" font-family="SF Pro Display,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Accommodation</text>
    <text x="86" y="460" font-family="SF Pro Display,-apple-system,sans-serif" font-size="11" fill="#64748b">Sea View Hotel</text>
    <text x="290" y="446" font-family="SF Pro Display,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">$520.00</text>

    <rect x="24" y="484" width="332" height="60" rx="16" fill="white" filter="url(#bgs)"/>
    <rect x="38" y="496" width="36" height="36" rx="10" fill="url(#bgorange)"/>
    <text x="46" y="520" font-family="sans-serif" font-size="16">🍽</text>
    <text x="86" y="510" font-family="SF Pro Display,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Food &amp; Dining</text>
    <text x="86" y="528" font-family="SF Pro Display,-apple-system,sans-serif" font-size="11" fill="#64748b">8 transactions</text>
    <text x="290" y="514" font-family="SF Pro Display,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">$180.00</text>

    <rect x="24" y="552" width="332" height="60" rx="16" fill="white" filter="url(#bgs)"/>
    <rect x="38" y="564" width="36" height="36" rx="10" fill="url(#bgpurple)"/>
    <text x="46" y="588" font-family="sans-serif" font-size="16">🚗</text>
    <text x="86" y="578" font-family="SF Pro Display,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#0f172a">Transport</text>
    <text x="86" y="596" font-family="SF Pro Display,-apple-system,sans-serif" font-size="11" fill="#64748b">Car rental + fuel</text>
    <text x="296" y="582" font-family="SF Pro Display,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0f172a">$90.00</text>

