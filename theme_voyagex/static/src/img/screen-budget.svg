    <circle cx="52" cy="684" r="16" fill="url(#bgteal)"/>
    <text x="44" y="689" font-family="SF Pro Display,-apple-system,sans-serif" font-size="10" font-weight="700" fill="white">JA</text>
    <text x="78" y="680" font-family="SF Pro Display,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#0f172a">James</text>
    <text x="78" y="696" font-family="SF Pro Display,-apple-system,sans-serif" font-size="10" fill="#64748b">Paid $620</text>
    <rect x="246" y="674" width="56" height="22" rx="11" fill="#ecfdf5"/>
    <text x="254" y="690" font-family="SF Pro Display,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#0ea5a5">Owed $0</text>
    <rect x="308" y="674" width="36" height="22" rx="11" fill="#f0fdfa"/>
    <text x="316" y="690" font-family="SF Pro Display,-apple-system,sans-serif" font-size="10" fill="#0ea5a5">→</text>

