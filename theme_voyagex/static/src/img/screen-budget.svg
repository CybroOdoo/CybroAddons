    <!-- Header -->
    <path d="M38 60 L30 68 L38 76" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="73" font-family="SF Pro Display,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Trip Expenses</text>
    <circle cx="340" cy="68" r="18" fill="#f0fdfa"/>
