    <line x1="0" y1="718" x2="380" y2="718" stroke="#f0fdfa" stroke-width="1"/>
    <rect x="38" y="726" width="10" height="8" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="28" y="752" font-family="SF Pro Display,-apple-system,sans-serif" font-size="10" fill="#94a3b8">Home</text>
    <circle cx="125" cy="732" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
