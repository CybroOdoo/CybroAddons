    <rect x="44" y="578" width="80" height="24" rx="12" fill="white" opacity="0.2"/>
    <text x="54" y="594" font-family="SF Pro Display,-apple-system,sans-serif" font-size="10" font-weight="600" fill="white">🎯 91% match</text>
