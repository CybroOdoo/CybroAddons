<section class="oe_container">
    <div class="oe_row oe_spaced">
        <div class="oe_span12">
            <h2 class="oe_slogan">{{display_name}}</h2>
            <h3 class="oe_slogan">{{summary}}</h3>
        </div>
    </div>
</section>

<section class="oe_container oe_dark">
    <div class="oe_row oe_spaced">
        <div class="oe_span12">
            <h4 class="oe_slogan">About this module</h4>
            <p class="oe_mt32">{{description}}</p>
        </div>
    </div>
</section>

<section class="oe_container">
    <div class="oe_row oe_spaced">
        <div class="oe_span12">
            <h4>Module Information</h4>
            <ul>
                <li><strong>Technical name:</strong> <code>{{technical_name}}</code></li>
                <li><strong>Version:</strong> {{version}}</li>
                <li><strong>Category:</strong> {{category}}</li>
                <li><strong>License:</strong> {{license}}</li>
                <li><strong>Depends on:</strong> {{depends_list}}</li>
            </ul>
        </div>
    </div>
</section>
