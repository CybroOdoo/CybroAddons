<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 44" fill="none">
  <!-- Globe with medical cross (original) -->
  <g transform="translate(2,2)">
    <!-- Globe circle -->
    <circle cx="20" cy="20" r="18" stroke="#006DB7" stroke-width="2" fill="none"/>
    <!-- Latitude lines -->
    <ellipse cx="20" cy="20" rx="10" ry="18" stroke="#006DB7" stroke-width="1.2" fill="none"/>
    <line x1="2" y1="20" x2="38" y2="20" stroke="#006DB7" stroke-width="1.2"/>
    <line x1="5" y1="12" x2="35" y2="12" stroke="#006DB7" stroke-width="1"/>
    <line x1="5" y1="28" x2="35" y2="28" stroke="#006DB7" stroke-width="1"/>
    <!-- Medical cross overlay -->
    <rect x="16" y="10" width="8" height="20" rx="2" fill="#006DB7" opacity="0.85"/>
    <rect x="10" y="16" width="20" height="8" rx="2" fill="#006DB7" opacity="0.85"/>
    <!-- Caduceus staff center -->
    <line x1="20" y1="10" x2="20" y2="30" stroke="white" stroke-width="1.5"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- Text -->
  <text x="46" y="19" font-family="'Arial',sans-serif" font-size="11" font-weight="700" fill="#006DB7" letter-spacing="1">WORLD HEALTH</text>
  <text x="46" y="33" font-family="'Arial',sans-serif" font-size="11" font-weight="700" fill="#006DB7" letter-spacing="1">ORGANIZATION</text>
</svg>
